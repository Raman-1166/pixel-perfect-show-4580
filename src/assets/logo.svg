<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', serif;
        font-weight: 600;
        letter-spacing: 0.16em;
      }
      .brand-tagline {
        font-family: 'Montserrat', sans-serif;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
    </style>

    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CA6E" />
      <stop offset="35%" stop-color="#C59B27" />
      <stop offset="70%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#A57F26" />
    </linearGradient>

    <!-- Master Ganesha + House Emblem Symbol (Centered at 0,0) -->
    <g id="emblem">
      <!-- Outer Architectural Roof / Gable Structure -->
      <path d="M 0 -85 L 82 -12 L 68 0 L 0 -60 L -68 0 L -82 -12 Z" fill="url(#brassGrad)" />
      
      <!-- Minimalist Gable Crown Apex Accent -->
      <circle cx="0" cy="-98" r="4.5" fill="url(#brassGrad)" />

      <!-- Minimal Sacred Ganesh Element: Crown / Tilak atop forehead -->
      <path d="M -9 -52 C -9 -61 -1 -65 0 -65 C 1 -65 9 -61 9 -52 C 9 -47 3 -43 0 -40 C -3 -43 -9 -47 -9 -52 Z" fill="url(#brassGrad)" />
      <circle cx="0" cy="-50" r="2.8" fill="#1F3A34" />

      <!-- Left Ear (Graceful arch meeting temple) -->
      <path d="M -20 -40 C -42 -40 -54 -24 -54 -3 C -54 18 -38 30 -21 31 C -15 31 -12 27 -13 22 C -14 17 -24 17 -29 10 C -35 0 -31 -20 -14 -22 C -8 -22 -5 -26 -5 -31 C -5 -37 -12 -40 -20 -40 Z" fill="url(#brassGrad)" />

      <!-- Right Ear -->
      <path d="M 20 -40 C 42 -40 54 -24 54 -3 C 54 18 38 30 21 31 C 15 31 12 27 13 22 C 14 17 24 17 29 10 C 35 0 31 -20 14 -22 C 8 -22 5 -26 5 -31 C 5 -37 12 -40 20 -40 Z" fill="url(#brassGrad)" />

      <!-- Trunk (Gently curved to the left in auspicious Valampuri/Edamuri harmony) -->
      <path d="M -7 -28 C 8 -28 11 -16 11 -4 C 11 13 4 30 -6 44 C -13 54 -27 58 -32 52 C -35 46 -31 36 -24 35 C -18 34 -16 40 -19 44 C -20 45 -23 44 -23 42 C -23 40 -14 35 -8 25 C -2 15 0 2 0 -6 C 0 -16 -2 -21 -7 -21 C -8 -21 -10 -23 -10 -25 C -10 -27 -9 -28 -7 -28 Z" fill="url(#brassGrad)" />

      <!-- Auspicious Right Tusk -->
      <path d="M 11 -1 C 18 -1 20 4 20 8 L 11 7 Z" fill="url(#brassGrad)" />

      <!-- Modern Foundation Plinth / Ground Line (House Base) -->
      <line x1="-66" y1="72" x2="66" y2="72" stroke="url(#brassGrad)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-44" y1="81" x2="44" y2="81" stroke="url(#brassGrad)" stroke-width="2" stroke-linecap="round" />
      
      <!-- Slender Modern House Wall Columns Framing Sacred Space -->
      <path d="M -58 0 L -58 62" stroke="url(#brassGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M 58 0 L 58 62" stroke="url(#brassGrad)" stroke-width="3" stroke-linecap="round" />
    </g>
  </defs>

  <!-- Deep Emerald Background -->
  <rect width="100%" height="100%" fill="#1F3A34" />

  <!-- Master Logo Lockup Centered -->
  <g transform="translate(400, 310) scale(1.65)">
    <use href="#emblem" />
  </g>

  <!-- Brand Wordmark -->
  <text x="400" y="550" text-anchor="middle" class="brand-title" font-size="34" fill="#FFFFFF">
    GANESH DREAM HOUSE
  </text>

  <!-- Decorative Tagline Lockup -->
  <g transform="translate(400, 600)">
    <line x1="-210" y1="-5" x2="-130" y2="-5" stroke="#C59B27" stroke-width="1.2" opacity="0.75" />
    <circle cx="-124" cy="-5" r="2.5" fill="#E5C158" />
    <text x="0" y="0" text-anchor="middle" class="brand-tagline" font-size="12" fill="#E2C981">
      LUXURY INTERIORS &amp; ESTATES
    </text>
    <circle cx="124" cy="-5" r="2.5" fill="#E5C158" />
    <line x1="130" y1="-5" x2="210" y2="-5" stroke="#C59B27" stroke-width="1.2" opacity="0.75" />
  </g>
</svg>